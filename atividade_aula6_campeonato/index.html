
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Campeonato</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏆 Campeonato Gamer 2026</h1>
        <p>Faça sua inscrição e participe da competição!</p>
    </header>

    <main>

        <section class="formulario">

            <h2>Ficha de Inscrição</h2>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="text" id="email" placeholder="Digite seu e-mail">

            <label for="data">Data de nascimento:</label>
            <input type="date" id="data">

            <label for="jogo">Escolha o jogo:</label>
            <select id="jogo">
                <option value="">Selecione um jogo</option>
                <option value="Valorant">Valorant</option>
                <option value="Counter-Strike 2">Counter-Strike 2</option>
                <option value="Fortnite">Fortnite</option>
                <option value="Minecraft">Minecraft</option>
            </select>

            <label for="nivel">Nível do jogador:</label>
            <select id="nivel">
                <option value="">Selecione seu nível</option>
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
            </select>

            <div class="botoes">
                <button onclick="cadastrar()">Cadastrar</button>
                <button class="limpar" onclick="limpar()">Limpar</button>
            </div>

        </section>

        <section class="resultado">

            <h2>📋 Dados da Inscrição</h2>

            <div id="dados">
                <p>Nenhum jogador cadastrado.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Campeonato Gamer 2026 - Boa sorte! 🎮</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
