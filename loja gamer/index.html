
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GAMEHUB</h1>
        <p>Controle de produtos da loja gamer</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Valor do estoque</h3>
                <p id="valorEstoque">R$ 0,00</p>
            </div>
        </section>

        <section class="painel">
            <h2 id="titulo">Cadastrar produto</h2>

            <form id="formulario">
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" required>

                <label for="categoria">Categoria:</label>
                <select id="categoria" required>
                    <option value="">Escolha uma categoria</option>
                    <option value="Jogos">Jogos</option>
                    <option value="Consoles">Consoles</option>
                    <option value="Acessórios">Acessórios</option>
                    <option value="Informática">Informática</option>
                </select>

                <label for="preco">Preço:</label>
                <input type="number" id="preco" min="0.01"
                    step="0.01" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0"
                    step="1" required>

                <button type="submit" id="botaoSalvar">
                    Cadastrar produto
                </button>

                <button type="button" id="botaoCancelar" hidden>
                    Cancelar edição
                </button>
            </form>
        </section>

        <section class="painel">
            <h2>Lista de produtos</h2>

            <label for="pesquisa">Pesquisar pelo nome:</label>
            <input type="text" id="pesquisa"
                placeholder="Digite o nome do produto">

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <p id="mensagem">Nenhum produto cadastrado.</p>
        </section>
    </main>

    <footer>
        <p>GAMEHUB - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
